sonar.projectKey=michalper_laravel-ddd-invoices
sonar.organization=michalper

# Analysis runs from CI rather than SonarCloud's Automatic Analysis, and that is the
# whole point: automatic analysis cannot import coverage, so 100% line coverage and
# the mutation score were invisible there. Automatic Analysis must be switched off in
# the project's settings, or the two compete and this file is ignored.
sonar.sources=.
sonar.tests=tests

# Produced by the tests job in .github/workflows/ci.yml.
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml

sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**,public/**,node_modules/**,build/**

# Coverage is measured over the module, matching tools/check-coverage.php. Framework
# scaffolding and config have no tests by design, and counting them would turn the
# number into noise.
sonar.coverage.exclusions=tests/**,database/**,config/**,bootstrap/**,routes/**,public/**,tools/**,app/**

# Two exclusions, both narrow and both with a reason. Neither is a blanket "ignore
# this rule" — the rule stays active everywhere else.
sonar.issue.ignore.multicriteria=archTestNames,ciServicePassword

# php:S100 wants camelCase method names. ArchitectureTest is the one test class that
# does not extend PHPUnit's TestCase — phpat compiles its methods into PHPStan rules —
# so Sonar treats it as ordinary code and flags all eight. The names are deliberate:
# phpat's show_rule_names option puts them in the failure message, so
# `test_the_domain_depends_on_no_framework` is what a developer reads when a boundary
# breaks. Sonar does not flag the PHPUnit suites, which extend TestCase.
sonar.issue.ignore.multicriteria.archTestNames.ruleKey=php:S100
sonar.issue.ignore.multicriteria.archTestNames.resourceKey=tests/Architecture/**/*

# secrets:S6697 flags the MySQL password in the database matrix job. It is a throwaway
# credential for a service container that exists for the few minutes of one CI run,
# is reachable only from that runner, and guards a database created and destroyed with
# it. There is nothing to rotate and nothing to leak. The rule stays on for every
# other path, which is where it would matter.
sonar.issue.ignore.multicriteria.ciServicePassword.ruleKey=secrets:S6697
sonar.issue.ignore.multicriteria.ciServicePassword.resourceKey=.github/workflows/ci.yml
