name: End-to-end

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pinned for the same reason as ci.yml: ubuntu-latest starts moving to Ubuntu
# 26.04 on 2026-10-19 and setup-php does not list it yet.
jobs:
  e2e:
    name: Lifecycle over HTTP
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, redis
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4

      - name: Prepare a real environment
        run: |
          cp .env.example .env
          # The service container is published on localhost, not a compose network.
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          touch database/database.sqlite
          php artisan migrate --force

      # A real web server and a real worker on a real queue. This is the only level
      # that exercises the asynchronous path: the feature suite runs the outbox job
      # inline, because Laravel fires afterCommit callbacks immediately under
      # RefreshDatabase and the testing queue connection is sync.
      - name: Boot the application and a queue worker
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          nohup php artisan queue:work --tries=5 --sleep=1 > storage/logs/worker.log 2>&1 &
          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/up > /dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Application did not become healthy in time." >&2
            cat storage/logs/serve.log || true
            exit 1
          fi
          echo "Application is up."

      - name: Run the end-to-end suite
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: vendor/bin/phpunit --testsuite=E2E --testdox

      # Proves the outbox actually reaches a fully settled state rather than leaving
      # durable intents behind.
      #
      # Both flags are load-bearing. Without --minutes=0 the command uses the
      # configured 15-minute threshold, and every row in a run this short is seconds
      # old, so the count would be 0 whether or not the worker ever started. Without
      # --strict the command exits 0 by design, so the step could only be gated by
      # grepping its prose — which is what this used to do, with an unanchored
      # pattern that "10 stalled notification(s)" also matched.
      #
      # The retry is not papering over flakiness, it is the assertion. The suite
      # finishes within a second or two of dispatching its last job, so a single
      # immediate check races the worker's own startup and poll interval and says
      # nothing. Polling until the outbox is settled, with a bound, is what makes
      # this mean "the durable intents do get drained". A worker that is dead rather
      # than merely slow still fails: --minutes=0 re-dispatches the stalled rows on
      # every attempt, and with nothing consuming them they stay unsettled until the
      # bound runs out.
      - name: Assert the outbox settles every notification
        run: |
          for _ in $(seq 1 30); do
            if php artisan invoices:reconcile --minutes=0 --strict; then
              echo "Outbox fully settled."
              exit 0
            fi
            sleep 2
          done
          echo "The outbox did not settle within 60s; the worker is not draining it." >&2
          exit 1

      - name: Show application logs on failure
        if: failure()
        run: |
          tail -n 100 storage/logs/serve.log || true
          tail -n 100 storage/logs/worker.log || true
          tail -n 200 storage/logs/laravel.log || true
