name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # .env.example ships a usable APP_KEY, so no key:generate is needed. No
      # migrate step either: the suite runs against an in-memory SQLite database
      # created per test class by RefreshDatabase.
      - run: cp .env.example .env

      - run: vendor/bin/phpunit --testdox --display-all-issues

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: pcov
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: cp .env.example .env

      - run: vendor/bin/phpunit --coverage-clover=coverage.xml

      # PHPUnit has no built-in floor, and a report nobody gates on is decoration.
      - run: php tools/check-coverage.php coverage.xml src/Modules/Invoices 95

  static-analysis:
    name: PHPStan (level max)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  style:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/pint --test

  rector:
    name: Rector (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # Reported, never applied in CI: modernisation drift surfaces on the pull
      # request instead of being rewritten behind the author's back.
      - run: vendor/bin/rector process --dry-run --no-progress-bar
