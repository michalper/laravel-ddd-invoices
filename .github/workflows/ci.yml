name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pinned to ubuntu-24.04 rather than ubuntu-latest: that label starts moving to
# Ubuntu 26.04 on 2026-10-19, and shivammathur/setup-php documents 22.04 and
# 24.04 only, so ubuntu-latest would drift onto an image where PHP 8.5 is not
# guaranteed to install. Revisit once setup-php lists 26.04.
jobs:
  tests:
    name: Tests (PHP 8.5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      # .env.example ships a usable APP_KEY, so no key:generate is needed. No
      # migrate step either: the suite runs against an in-memory SQLite database
      # created per test class by RefreshDatabase.
      - run: cp .env.example .env

      - run: vendor/bin/phpunit --testdox --display-all-issues

  coverage:
    name: Coverage floor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: pcov
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      - run: cp .env.example .env

      - run: vendor/bin/phpunit --coverage-clover=coverage.xml

      # PHPUnit has no built-in floor, and a report nobody gates on is decoration.
      - run: php tools/check-coverage.php coverage.xml src/Modules/Invoices 95

  static-analysis:
    name: PHPStan (level max)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  style:
    name: Pint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/pint --test

  rector:
    name: Rector (dry run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      # Reported, never applied in CI: modernisation drift surfaces on the pull
      # request instead of being rewritten behind the author's back.
      - run: vendor/bin/rector process --dry-run --no-progress-bar
